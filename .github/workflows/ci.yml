name: Synthetic CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.8.22
      - run: python scripts/preflight.py
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev ruff check .
      - run: uv run --frozen --extra dev ruff format --check .
      - run: uv run --frozen --extra dev pytest -q
      - run: uv build
      - run: uv run --frozen --extra dev python -m xauusd_quote_lab.synthetic
      - run: uv run --frozen --extra dev python -m xauusd_quote_lab.replay
      - run: uv run --frozen --extra dev python scripts/audit_public_files.py
      - run: uv run --frozen --extra dev python -m xauusd_quote_lab.sampling_experiments --output dist/p2-experiment
      - run: uv run --frozen --extra dev python -m xauusd_quote_lab.factorial_experiment --output dist/p21-experiment
