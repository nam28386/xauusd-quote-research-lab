name: Synthetic CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.8.22
      - run: python scripts/preflight.py
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev ruff check .
      - run: uv run --frozen --extra dev ruff format --check .
      - run: uv run --frozen --extra dev pytest -q
      - run: uv build
      - run: uv run --frozen --extra dev python -m xauusd_quote_lab.synthetic
      - run: uv run --frozen --extra dev python -m xauusd_quote_lab.replay
      - run: uv run --frozen --extra dev python scripts/audit_public_files.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - run: npm --prefix web audit
      - run: uv run --frozen --extra dev python scripts/accept_baseline.py --artifacts dist/observatory-inputs
      - if: runner.os == 'Linux'
        run: npm --prefix web exec -- playwright install --with-deps chromium
      - if: runner.os == 'Windows'
        run: npm --prefix web exec -- playwright install chromium
      - run: npm --prefix web run test:e2e
      - if: runner.os == 'Windows'
        shell: pwsh
        run: .\workstation.ps1 preflight
      - if: runner.os == 'Windows'
        shell: pwsh
        run: .\workstation.ps1 package --artifacts dist/observatory-inputs --output dist/workstation-release
      - if: runner.os == 'Windows'
        shell: pwsh
        run: .\workstation.ps1 smoke --archive dist/workstation-release/xauusd-quote-lab-0.5.0rc1.zip
      - if: runner.os == 'Linux'
        run: sh workstation.sh preflight
      - if: runner.os == 'Linux'
        run: sh workstation.sh package --artifacts dist/observatory-inputs --output dist/workstation-release
      - if: runner.os == 'Linux'
        run: sh workstation.sh smoke --archive dist/workstation-release/xauusd-quote-lab-0.5.0rc1.zip
      - if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/workstation-v')
        run: npm --prefix web sbom --omit=dev --sbom-format=cyclonedx > dist/workstation-release/web-sbom.cdx.json
      - if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/workstation-v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workstation-verified
          path: dist/workstation-release/
          if-no-files-found: error
  provenance:
    if: startsWith(github.ref, 'refs/tags/workstation-v')
    needs: synthetic
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: workstation-verified
          path: dist/workstation-release
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: dist/workstation-release/*
