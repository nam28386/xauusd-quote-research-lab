name: Synthetic CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.8.22
      - run: python scripts/preflight.py
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev ruff check .
      - run: uv run --frozen --extra dev ruff format --check .
      - run: uv run --frozen --extra dev pytest -q
      - run: uv build
      - run: uv run --frozen --extra dev python -m xauusd_quote_lab.synthetic
      - run: uv run --frozen --extra dev python -m xauusd_quote_lab.replay
      - run: uv run --frozen --extra dev python scripts/audit_public_files.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - run: npm --prefix web audit
      - run: uv run --frozen --extra dev python scripts/start_observatory.py --artifacts dist/observatory-inputs --prepare-only
      - if: runner.os == 'Linux'
        run: npm --prefix web exec -- playwright install --with-deps chromium
      - if: runner.os == 'Windows'
        run: npm --prefix web exec -- playwright install chromium
      - run: npm --prefix web run test:e2e
